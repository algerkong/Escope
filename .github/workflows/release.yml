name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v0.1.0
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Check tag matches app version
        run: |
          echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Invalid tag: $RELEASE_TAG"; exit 1; }
          version="${RELEASE_TAG#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            actual=$(jq -r .version "$file")
            [ "$actual" = "$version" ] || { echo "$file version $actual != $version"; exit 1; }
          done
          grep -q "^version = \"$version\"$" src-tauri/Cargo.toml || { echo "Cargo.toml version != $version"; exit 1; }
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            notes="docs/releases/$RELEASE_TAG.md"
            [ -f "$notes" ] || { echo "Missing $notes"; exit 1; }
            # The release list lags behind a new draft, so take the id from the create response.
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$RELEASE_TAG" \
              -f name="EScope $RELEASE_TAG" -F draft=true -F body=@"$notes" --jq .id)
          fi
          # tauri-action skips every upload without failing when releaseId is empty.
          echo "$id" | grep -Eq '^[0-9]+$' || { echo "No release id for $RELEASE_TAG"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
