[package]
name = "escope"
version = "0.1.0"
description = "Local-first Elasticsearch workbench"
edition = "2021"
rust-version = "1.85"

[lib]
name = "escope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
zeroize = "1"

# F08.1: OS credential store. Only the maintained keyring platform backend is used,
# no hand-written OS FFI. macOS/Linux backends stay out until they are verified.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
